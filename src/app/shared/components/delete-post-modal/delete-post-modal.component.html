@if (isOpen() && post()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs animate-in fade-in duration-200"
    (click)="close()">
    <div class="relative w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-slate-100 dark:border-gray-700 overflow-hidden p-6 text-center"
        (click)="$event.stopPropagation()">

        <!-- Warning Icon -->
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 flex items-center justify-center text-2xl shadow-inner">
            <i class="fa-solid fa-trash-can"></i>
        </div>

        <!-- Heading -->
        <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">
            Delete Post?
        </h3>

        <!-- Description -->
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
            Are you sure you want to delete this post? This action cannot be undone and the post will be removed permanently.
        </p>

        <!-- Error Message -->
        @if (errorMessage()) {
        <div class="p-3 mb-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs flex items-center gap-2 text-left">
            <i class="fa-solid fa-circle-exclamation shrink-0"></i>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- Action Buttons -->
        <div class="flex items-center justify-center gap-3">
            <button type="button" (click)="close()" [disabled]="isDeleting()"
                class="w-1/2 py-2.5 px-4 text-sm font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-gray-700 hover:bg-slate-200 dark:hover:bg-gray-600 rounded-xl transition-colors cursor-pointer disabled:opacity-50">
                Cancel
            </button>
            <button type="button" (click)="confirmDelete()" [disabled]="isDeleting()"
                class="w-1/2 py-2.5 px-4 text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 dark:bg-rose-500 dark:hover:bg-rose-600 rounded-xl shadow-sm transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center justify-center gap-2">
                @if (isDeleting()) {
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <span>Deleting...</span>
                } @else {
                <i class="fa-solid fa-trash"></i>
                <span>Delete</span>
                }
            </button>
        </div>

    </div>
</div>
}
