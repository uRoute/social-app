@if (pwaService.updateAvailable()) {
  <aside aria-label="App update notification" class="fixed bottom-5 right-5 z-[999999] flex items-center gap-3 p-3.5 bg-white/95 dark:bg-gray-800/95 backdrop-blur-md border border-indigo-200/80 dark:border-indigo-900/80 shadow-2xl rounded-2xl text-sm">
    <div class="flex items-center gap-2 text-indigo-600 dark:text-indigo-400">
      <i class="fa-solid fa-arrows-rotate animate-spin"></i>
      <span class="font-medium text-gray-800 dark:text-gray-100">Update available</span>
    </div>
    <button (click)="pwaService.activateUpdate()"
      class="px-3 py-1.5 text-xs font-semibold text-white bg-mainColor hover:bg-indigo-800 rounded-xl shadow-xs transition-colors cursor-pointer">
      Reload
    </button>
  </aside>
}
