<nav
  class="bg-white dark:bg-gray-800 w-full z-40 border-b border-gray-200 dark:border-gray-700 shadow-2xs shadow-gray-200 dark:shadow-none transition-colors duration-200">
  <div class="container flex flex-wrap items-center justify-between p-1">
    <a routerLink="/" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img src="./Images/logo-resize-2.png" class="h-12" alt="Social app Logo" />
      <span class="self-center text-xl main-text-colors font-semibold whitespace-nowrap">Social-App</span>
    </a>

    <!-- Right-side actions: Theme Toggle + User Menu (when logged) / Mobile Hamburger -->
    <div class="flex items-center md:order-2 space-x-2 md:space-x-3 rtl:space-x-reverse">
      <!-- Dark / Light Mode Toggle Button -->
      <button type="button" (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        class="inline-flex items-center justify-center w-10 h-10 text-sm font-medium text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-400 dark:focus:ring-indigo-500 transition-all duration-200 cursor-pointer">
        @if (isDarkMode()) {
        <i class="fa-solid fa-sun text-amber-400 text-lg transition-transform duration-300 hover:rotate-45"></i>
        } @else {
        <i
          class="fa-solid fa-moon text-indigo-600 text-lg transition-transform duration-300 -rotate-12 hover:rotate-0"></i>
        }
      </button>

      @if(isLogged()){
      <span class="dark:text-white"> {{currentUserData()?.name}} </span>
      <button type="button"
        class="flex text-sm bg-neutral-primary rounded-full md:me-0 focus:ring-4 focus:ring-neutral-tertiary cursor-pointer"
        id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom">
        <span class="sr-only">Open user menu</span>
        <img class="w-8 h-8 rounded-full" [src]="currentUserData()?.photo" [alt]="currentUserData()?.name">
      </button>

      <!-- Dropdown menu -->
      <div
        class="z-50 hidden bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg w-44"
        id="user-dropdown">
        <ul class="p-2 text-sm text-gray-700 dark:text-gray-200 font-medium" aria-labelledby="user-menu-button">
          <li>
            <a routerLink="/settings"
              class="inline-flex items-center w-full p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Settings</a>
          </li>
          <li>
            <a (click)="signOut()"
              class="inline-flex items-center w-full p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-rose-600 dark:text-rose-400 cursor-pointer transition-colors">Sign
              out</a>
          </li>
        </ul>
      </div>

      <button data-collapse-toggle="navbar-user" type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-600 dark:text-gray-300 rounded-lg md:hidden hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:focus:ring-gray-600 cursor-pointer"
        aria-controls="navbar-user" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      </button>
      }
    </div>

    @if(isLogged()){
    <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-user">
      <ul
        class="font-medium shadow-2xs bg-secondColor dark:bg-gray-800/80 gap-2 text-gray-600 dark:text-gray-300 flex flex-col p-1 my-1 md:m-0 border-2 border-gray-200 dark:border-gray-700 rounded-base md:flex-row rtl:space-x-reverse transition-colors">
        <li routerLinkActive="btn-active bg-gray-50 dark:bg-gray-700 text-mainColor dark:text-blue-400"
          routerLink="/feeds"
          class="cursor-pointer p-2 rounded-2xl hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-mainColor dark:hover:text-blue-400 duration-200 flex justify-center items-center md:justify-between md:items-center">
          <i class="fa-solid fa-house-user"></i>
          <a class="ms-1.5">Feeds</a>
        </li>

        <li routerLinkActive="btn-active bg-gray-50 dark:bg-gray-700 text-mainColor dark:text-blue-400"
          routerLink="/profile"
          class="cursor-pointer p-2 rounded-2xl hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-mainColor dark:hover:text-blue-400 duration-200 flex justify-center items-center md:justify-between md:items-center">
          <i class="fa-solid fa-circle-user"></i>
          <a class="ms-1.5">Profile</a>
        </li>

        <li routerLinkActive="btn-active bg-gray-50 dark:bg-gray-700 text-mainColor dark:text-blue-400"
          routerLink="/notifications"
          class="cursor-pointer p-2 rounded-2xl hover:bg-gray-50 dark:hover:bg-gray-700 hover:text-mainColor dark:hover:text-blue-400 duration-200 flex justify-center items-center md:justify-between md:items-center">
          <i class="fa-solid fa-bell"></i>
          <a class="ms-1.5">Notifications</a>
        </li>
      </ul>
    </div>
    }
  </div>
</nav>
