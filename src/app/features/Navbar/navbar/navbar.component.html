<nav
  class="bg-white/70 dark:bg-gray-900/70 backdrop-blur-xl backdrop-saturate-150 w-full z-40 border-b border-gray-200/50 dark:border-white/10 shadow-xs shadow-slate-900/5 dark:shadow-black/20 transition-all duration-300">
  <div class="container flex flex-wrap items-center justify-between p-2">
    <a routerLink="/"
      class="flex items-center space-x-3 rtl:space-x-reverse transition-transform hover:scale-[1.02] duration-200">
      <img src="./Images/logo-resize.png" class="h-11 drop-shadow-xs" alt="Social app Logo" />
      <span class="self-center text-xl main-text-colors font-bold tracking-tight whitespace-nowrap">Social-App</span>
    </a>

    <!-- Right-side actions: Theme Toggle + User Menu (when logged) / Mobile Hamburger -->
    <div class="flex items-center md:order-2 space-x-2 md:space-x-3 rtl:space-x-reverse">
      <!-- PWA Install Button -->
      @if (pwaService.canInstall()) {
      <button type="button" (click)="pwaService.promptInstall()" aria-label="Install Social App"
        title="Install Social App on your device"
        class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-semibold text-white bg-mainColor hover:bg-indigo-800 rounded-full shadow-xs hover:shadow-md transition-all duration-200 cursor-pointer">
        <i class="fa-solid fa-download"></i>
        <span class="hidden sm:inline">Install</span>
      </button>
      }

      <!-- Dark / Light Mode Toggle Button -->
      <button type="button" (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        class="inline-flex items-center justify-center w-10 h-10 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white/60 dark:bg-gray-800/60 hover:bg-white/90 dark:hover:bg-gray-700/80 border border-gray-200/60 dark:border-gray-700/60 backdrop-blur-md rounded-full shadow-xs hover:shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-400 dark:focus:ring-indigo-500 transition-all duration-200 cursor-pointer">
        @if (isDarkMode()) {
        <i class="fa-solid fa-sun text-amber-400 text-lg transition-transform duration-300 hover:rotate-45"></i>
        } @else {
        <i
          class="fa-solid fa-moon text-indigo-600 text-lg transition-transform duration-300 -rotate-12 hover:rotate-0"></i>
        }
      </button>

      @if(isLogged()){
      <div
        class="bg-white/60 dark:bg-gray-800/60 backdrop-blur-md border border-gray-200/60 dark:border-gray-700/60 px-2.5 py-1 rounded-full flex justify-between gap-2 items-center shadow-xs">
        <span class="text-sm hidden md:inline font-bold text-gray-700 dark:text-gray-100"> {{currentUserData()?.name}}
        </span>
        <div class="flex justify-between items-center gap-1">
          <button type="button"
            class="flex text-sm bg-neutral-primary rounded-full md:me-0 focus:ring-4 focus:ring-indigo-200 dark:focus:ring-indigo-900/50 cursor-pointer transition-transform hover:scale-105"
            id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown"
            data-dropdown-placement="bottom">
            <span class="sr-only">Open user menu</span>
            <img class="w-8 h-8 rounded-full ring-2 ring-white/80 dark:ring-gray-700 shadow-xs"
              [src]="currentUserData()?.photo" [alt]="currentUserData()?.name">
          </button>

          <!-- Dropdown menu -->
          <div
            class="z-50 hidden bg-white/85 dark:bg-gray-800/85 backdrop-blur-xl border border-gray-200/70 dark:border-gray-700/70 rounded-2xl shadow-xl shadow-slate-900/10 dark:shadow-black/30 w-48 divide-y divide-gray-100 dark:divide-gray-700/50"
            id="user-dropdown">
            <span class="my-1.5 text-center font-extrabold text-sm block md:hidden text-gray-700 dark:text-gray-100">
              Hello, {{currentUserData()?.name}}
            </span>
            <ul class="p-2 text-sm text-gray-700 dark:text-gray-200 font-medium space-y-1"
              aria-labelledby="user-menu-button">
              @if (pwaService.canInstall()) {
              <li>
                <button type="button" (click)="pwaService.promptInstall()"
                  class="inline-flex items-center w-full px-3 py-2 hover:bg-indigo-50/80 dark:hover:bg-gray-700/70 rounded-xl text-mainColor dark:text-indigo-400 font-semibold cursor-pointer transition-all duration-150">
                  <i class="fa-solid fa-download me-2"></i> Install App
                </button>
              </li>
              }
              <li>
                <a routerLink="/settings"
                  class="inline-flex items-center w-full px-3 py-2 hover:bg-indigo-50/80 dark:hover:bg-gray-700/70 rounded-xl transition-all duration-150">
                  <i class="fa-solid fa-gear me-2 text-gray-400"></i> Settings
                </a>
              </li>
              <li>
                <a (click)="signOut()"
                  class="inline-flex items-center w-full px-3 py-2 hover:bg-rose-50/80 dark:hover:bg-rose-950/40 rounded-xl text-rose-600 dark:text-rose-400 cursor-pointer transition-all duration-150">
                  <i class="fa-solid fa-arrow-right-from-bracket me-2 text-rose-500"></i> Sign out
                </a>
              </li>
            </ul>
          </div>

          <button data-collapse-toggle="navbar-user" type="button"
            class="inline-flex items-center p-2 w-9 h-9 justify-center text-sm text-gray-600 dark:text-gray-300 rounded-lg md:hidden hover:bg-white/80 dark:hover:bg-gray-700/60 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:focus:ring-gray-600 cursor-pointer transition-colors"
            aria-controls="navbar-user" aria-expanded="false">
            <span class="sr-only">Open main menu</span>
            <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
            </svg>
          </button>
        </div>
      </div>
      }
    </div>

    @if(isLogged()){
    <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-user">
      <ul
        class="font-medium bg-white/50 dark:bg-gray-800/50 backdrop-blur-md border border-gray-200/60 dark:border-gray-700/60 rounded-2xl p-1 gap-1 text-gray-600 dark:text-gray-300 flex flex-col my-1 md:m-0 md:flex-row rtl:space-x-reverse shadow-xs transition-colors">
        <li routerLinkActive="btn-active !bg-white/90 dark:!bg-gray-700/90 shadow-xs" routerLink="/feeds"
          class="cursor-pointer px-4 py-2 rounded-xl hover:bg-white/60 dark:hover:bg-gray-700/60 hover:text-mainColor dark:hover:text-blue-400 duration-200 flex justify-center items-center md:justify-between md:items-center transition-all">
          <i class="fa-solid fa-house-user"></i>
          <a class="ms-2">Feeds</a>
        </li>

        <li routerLinkActive="btn-active !bg-white/90 dark:!bg-gray-700/90 shadow-xs" routerLink="/profile"
          class="cursor-pointer px-4 py-2 rounded-xl hover:bg-white/60 dark:hover:bg-gray-700/60 hover:text-mainColor dark:hover:text-blue-400 duration-200 flex justify-center items-center md:justify-between md:items-center transition-all">
          <i class="fa-solid fa-circle-user"></i>
          <a class="ms-2">Profile</a>
        </li>

        <li routerLinkActive="btn-active !bg-white/90 dark:!bg-gray-700/90 shadow-xs" routerLink="/notifications"
          class="cursor-pointer px-4 py-2 rounded-xl hover:bg-white/60 dark:hover:bg-gray-700/60 hover:text-mainColor dark:hover:text-blue-400 duration-200 flex justify-center items-center md:justify-between md:items-center transition-all">
          <i class="fa-solid fa-bell"></i>
          <a class="ms-2">Notifications</a>
        </li>
      </ul>
    </div>
    }
  </div>
</nav>
