<div class="left-side-nav flex flex-row lg:flex-col flex-wrap p-2 bg-white rounded-lg  sticky top-0 left-0">

    <button type="button" (click)="changeFeed('community')" [class.btn-active]="actvieState == 'community'"
        class="block cursor-pointer px-2 py-1 my-1 rounded-xl text-lg font-bold w-1/2 lg:w-full text-start text-gray-600 hover:bg-slate-100 duration-200">
        <i class="fa-solid fa-users-rays mr-1"></i> Community</button>
    <button type="button" (click)="changeFeed('feed')" [class.btn-active]="actvieState == 'feed'"
        class="block cursor-pointer px-2 py-1 my-1 rounded-xl text-lg font-bold w-1/2 lg:w-full text-start text-gray-600 hover:bg-slate-100 duration-200">
        <i class="fa-solid fa-newspaper mr-1"></i> Feed</button>
    <button type="button" (click)="changeFeed('saved')" [class.btn-active]="actvieState == 'saved'"
        class="block cursor-pointer px-2 py-1 my-1 rounded-xl text-lg font-bold w-full text-start text-gray-600 hover:bg-slate-100 duration-200">
        <i class="fa-regular fa-bookmark mr-1"></i> Saved</button>

</div>
