<section class="bg-white dark:bg-gray-700/50 dark:text-white p-2 rounded-xl">


    <form #form (submit)="createNewPost($event , form)">
        <div class="head flex items-center gap-1.5">
            <div class="user-photo w-10 h-10 p-0.5 rounded-full border-2 border-gray-400">
                <img class="w-full h-full rounded-full" [src]="currentUserData()?.photo"
                    [alt]="currentUserData()?.name">
            </div>
            <div class="user-toggle">
                <div class="user-name my-1">
                    <h2 class="font-bold text-sm text-gray-900 dark:text-white"> {{currentUserData()?.name}} </h2>
                </div>
                <div class="flex items-center justify-center">
                    <select [formControl]="postPrivacy"
                        class="bg-[#f0f0f0] dark:bg-gray-800 dark:border-gray-600 px-4 py-1 rounded-full text-sm font-medium text-gray-800 dark:text-white cursor-pointer"
                        name="Privacy-settings" id="">
                        <option value="public">Public</option>
                        <option value="following">Followers</option>
                        <option value="only_me">Only Me</option>
                    </select>
                </div>
            </div>
        </div>


        <div class="body">
            <div class="mt-3">
                <textarea [formControl]="postContent" name="post-content" id="post-content"
                    class="w-full border-gray-200 rounded-lg bg-slate-100 dark:bg-slate-700 dark:text-white text-lg text-gray-900 placeholder:text-gray-500 dark:placeholder:text-gray-400 p-2 focus:outline-none focus:ring-1 focus:ring-indigo"
                    placeholder="What's on your mind?"></textarea>
            </div>
            <hr />
            @if(imgURL()){
            <div class="h-[35vh] my-4 rounded-lg overflow-hidden relative group">
                <img class="w-full h-full object-cover" [src]="imgURL()" alt="">
                <button (click)="removeImg()"
                    class="absolute top-1 right-1 bg-white p-2 rounded-full cursor-pointer hidden group-hover:flex items-center justify-center shadow">
                    <i class="fa-solid fa-xmark text-gray-700"></i>
                </button>
            </div>
            }

            <div class="post-actions flex justify-between items-center mt-1">
                <div class="flex items-center gap-2">
                    <label
                        class="text-indigo flex items-center gap-1 cursor-pointer duration-150 hover:bg-[#e7f3ff] p-1.5 rounded-md"
                        for="file"><i class="fa-solid fa-image text-xl"></i>Photo</label>
                    <input (change)="handlePostImage($event)" id="file" class="hidden" type="file">
                </div>

                <div>
                    <button type="submit" [disabled]="isLoading()"
                        class="py-1 px-4 bg-indigo text-white rounded-full hover:bg-indigo-800 cursor-pointer duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                        @if (isLoading()) {
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        } @else {
                        Post
                        <i class="fa-solid fa-paper-plane"></i>
                        }
                    </button>
                </div>
            </div>
        </div>
    </form>


</section>
