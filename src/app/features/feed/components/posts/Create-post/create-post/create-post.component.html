<section class="bg-white p-2 rounded-xl">


    <div class="head flex items-center gap-1.5">
        <div class="user-photo w-10 h-10 p-0.5 rounded-full border-2 border-gray-400">
            <img class="w-full h-full rounded-full" src="./Images/default-profile.png" alt="">
        </div>
        <div class="user-toggle">
            <div class="user-name my-1">
                <h2 class="font-bold text-sm"> Youssef </h2>
            </div>
            <div class="flex items-center justify-center">
                <select class="bg-[#f0f0f0] border-gray-300 px-4 py-1 rounded-full text-sm font-medium cursor-pointer"
                    name="Privacy-settings" id="">
                    <option value="public">Public</option>
                    <option value="following">Followers</option>
                    <option value="only_me">Only Me</option>
                </select>
            </div>
        </div>
    </div>


    <div class="body">
        <div class="mt-3">
            <textarea name="post-content" id="post-content"
                class="w-full border-gray-200 rounded-lg bg-slate-100 text-lg"
                placeholder="What's on your mind?"></textarea>
        </div>
        <hr />
        <div class="post-actions flex justify-between items-center mt-1">
            <div class="flex items-center gap-2">
                <label
                    class="text-indigo flex items-center gap-1 cursor-pointer duration-150 hover:bg-[#e7f3ff] p-1.5 rounded-md"
                    for="file"><i class="fa-solid fa-image text-xl"></i>Photo</label>
                <input id="file" class="hidden" type="file">
            </div>

            <div>
                <button
                    class="py-1 px-4 bg-indigo text-white rounded-full hover:bg-indigo-800 cursor-pointer duration-150">
                    Post
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>


</section>
