<div class="right-side-nav p-1 sticky top-0 left-0">

    <div class="p-2 rounded-lg bg-white">

        <div class="my-1">
            <h3 class="font-medium text-gray-700"><i class="fa-solid fa-user-group"></i> Suggested Friends</h3>
            <div class="suggested-search my-2">
                <label class="hidden" for="suggestedSeacrh">Search</label>
                <input [(ngModel)]="searchQuery"
                    class="bg-sky-50 focus:bg-transparent py-1 px-2 rounded-xl block w-full border-none outline-none focus:outline-0 focus:border-none focus:border-transparent text-gray-900 placeholder:text-gray-500"
                    placeholder="Search by @user_name ...." type="text" name="suggestedSeacrh" id="suggestedSeacrh">
            </div>
        </div>

        @for(suggest of (suggestedFriends() | search : searchQuery()) ; track suggest._id){
        <div class="my-1 ">

            <div class="border-2 border-gray-200 rounded-full px-2 py-0.5">

                <div class="friend-head flex justify-between items-center">
                    <div [routerLink]="['/userprofile', suggest._id]"
                        class="cursor-pointer friend-info flex items-center justify-between gap-1.5 hover:bg-slate-50/90 duration-200 p-1 rounded-lg">
                        <div class="w-10 h-10 rounded-full p-0.5 border-2 border-gray-300">
                            <img class="w-full h-full rounded-full" [src]="suggest.photo"
                                [alt]="suggest.username+'s photo'">
                        </div>
                        <div class="friend-name">
                            <h2 class="text-sm font-bold text-gray-900"> {{suggest.name}} </h2>
                            <h6 class="text-xs text-gray-500"> {{suggest.username}} </h6>
                        </div>

                    </div>
                    <div>
                        <button (click)="followOrUnfollow(suggest._id)"
                            class="block py-1 px-2 rounded-4xl text-sm cursor-pointer font-bold bg-[#e7f3ff] text-indigo-500">
                            <i class="fa-solid fa-user-plus"></i> Follow</button>
                    </div>
                </div>

            </div>

        </div>
        }




    </div>

</div>
